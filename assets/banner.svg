<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Nirob Islam — Web Developer, Video Editor and Motion Designer from Bogura, Bangladesh">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0f14"/><stop offset="1" stop-color="#151b28"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.85" cy="0.1" r="0.6"><stop offset="0" stop-color="#ff8a3d" stop-opacity=".45"/><stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="0.05" cy="1" r="0.5"><stop offset="0" stop-color="#2bc4c4" stop-opacity=".25"/><stop offset="1" stop-color="#2bc4c4" stop-opacity="0"/></radialGradient>
    <linearGradient id="t" x1="0" x2="1"><stop offset="0" stop-color="#ff8a3d"/><stop offset="1" stop-color="#ffb36b"/></linearGradient>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="24" fill="url(#g1)"/>
  <rect width="1200" height="300" rx="24" fill="url(#g2)"/>
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <text x="64" y="92" font-size="20" font-weight="700" letter-spacing="4" fill="#ff8a3d">HI THERE, I'M</text>
    <text x="62" y="162" font-size="68" font-weight="800" fill="url(#t)">Nirob Islam</text>
    <text x="64" y="208" font-size="26" fill="#eef1f6">Web Developer · Video Editor · Motion Designer</text>
    <text x="64" y="250" font-size="20" fill="#9aa6ba">📍 Bogura, Bangladesh   ·   nirobislam.com</text>
  </g>
  <!-- টাইমলাইনের মতো নকশা -->
  <g transform="translate(860 110)">
    <rect width="270" height="96" rx="14" fill="#161c28" stroke="#253045"/>
    <rect x="18" y="20" width="96" height="16" rx="5" fill="#b06bff"/>
    <rect x="122" y="20" width="62" height="16" rx="5" fill="#2bc4c4"/>
    <rect x="192" y="20" width="60" height="16" rx="5" fill="#ff8a3d"/>
    <rect x="18" y="46" width="150" height="16" rx="5" fill="#ff8a3d" opacity=".75"/>
    <rect x="176" y="46" width="76" height="16" rx="5" fill="#b06bff" opacity=".75"/>
    <text x="18" y="84" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#9aa6ba">&lt;/&gt; code  ▶ edit  ✦ motion</text>
    <rect x="140" y="10" width="2" height="62" fill="#fff"><animate attributeName="x" values="18;252;18" dur="6s" repeatCount="indefinite"/></rect>
  </g>
